<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Layout Brain Network</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; 
            align-items: center; background: #fff; margin: 0; padding: 0.5px; overflow: hidden; 
            user-select: none;
        }
        #controls { 
            display: flex; flex-direction: column; gap: 3px; background: #f8f9fa; 
            padding: 2.5px; border-radius: 2px; width: 90%; box-shadow: 0 0.5px 1px rgba(0,0,0,0.1); z-index: 10;
        }
        .control-group { display: flex; flex-direction: column; align-items: center; }
        
        /* Reduced Label Size */
        label { font-weight: bold; margin-bottom: 0.5px; color: #333; font-size: 5.5px; }
        
        /* Reduced Button and Text Spacing */
        .btn-row { display: flex; align-items: center; gap: 2px; }
        
        /* Shrunk the + and - Buttons */
        button { 
            background: #0078D4; color: white; border: none; border-radius: 1.5px; 
            width: 7px; height: 5.5px; font-size: 4px; font-weight: bold; cursor: pointer;
            line-height: 1; display: flex; justify-content: center; align-items: center;
        }
        button:active { background: #005A9E; }
        
        /* Reduced the 50% Text Size */
        .val-display { font-size: 3px; font-weight: bold; width: 8px; text-align: center; }
        
        /* Scaled down SVG size */
        svg { background: #fafafa; border-radius: 2px; margin-top: 2px; width: 80px; height: 70px; }
        .node { fill: #0078D4; stroke: #fff; stroke-width: 0.5px; }
        .link { stroke: #aaa; stroke-opacity: 0.5; stroke-width: 0.25px; }
    </style>
</head>
<body>
    <div id="controls">
        <div class="control-group">
            <label>Global Density</label>
            <div class="btn-row">
                <button onpointerdown="changeDensity(-20, event)">-</button>
                <span class="val-display" id="densityVal">50%</span>
                <button onpointerdown="changeDensity(20, event)">+</button>
            </div>
        </div>
        <div class="control-group">
            <label>Global Synchrony</label>
            <div class="btn-row">
                <button onpointerdown="changeSync(-20, event)">-</button>
                <span class="val-display" id="syncVal">50%</span>
                <button onpointerdown="changeSync(20, event)">+</button>
            </div>
        </div>
    </div>
    <svg viewBox="0 0 80 70"></svg>

    <script>
        // Scaled down canvas
        const width = 80, height = 70, numNodes = 30;
        const svg = d3.select("svg");
        
        let currentDensity = 50;
        let currentSync = 50;

        // Scaled down radius for tiny box
        const nodes = Array.from({length: numNodes}, (_, i) => ({ id: i, radius: 1.5 }));
        
        // 1. GENERATE LINKS SAFELY
        let allLinks = [];
        for (let i = 0; i < numNodes; i++) {
            for (let j = i + 1; j < numNodes; j++) {
                let weight = (j === i + 1) ? 100 : Math.random() * 100;
                allLinks.push({ 
                    source: nodes[i], 
                    target: nodes[j], 
                    weight: weight 
                });
            }
        }
        allLinks.sort((a, b) => b.weight - a.weight);

        // 2. PRE-CALCULATE STATIC LAYOUT BASED ON 40% DENSITY
        const layoutLinksCount = Math.floor(0.40 * allLinks.length);
        const layoutLinks = allLinks.slice(0, Math.max(numNodes - 1, layoutLinksCount));

        // Scaled down physics forces for the 80x70 boundary
        const simulation = d3.forceSimulation(nodes)
            .force("charge", d3.forceManyBody().strength(-10)) 
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collide", d3.forceCollide().radius(3))
            .force("link", d3.forceLink(layoutLinks).distance(7.5)); 

        // Lock coordinates
        simulation.stop();
        for (let i = 0; i < 300; ++i) {
            simulation.tick();
        }

        // 3. DRAW GRAPH ELEMENTS
        let linkGroup = svg.append("g").attr("class", "links");
        let nodeGroup = svg.append("g").attr("class", "nodes");

        nodeGroup.selectAll("circle")
            .data(nodes)
            .join("circle")
            .attr("class", "node")
            .attr("r", d => d.radius)
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);

        // 4. INTERACTION LOGIC
        window.changeDensity = function(amount, event) {
            if(event) { event.preventDefault(); event.stopPropagation(); }
            currentDensity = Math.max(0, Math.min(100, currentDensity + amount));
            document.getElementById("densityVal").innerText = currentDensity + "%";
            updateGraph();
        };

        window.changeSync = function(amount, event) {
            if(event) { event.preventDefault(); event.stopPropagation(); }
            currentSync = Math.max(0, Math.min(100, currentSync + amount));
            document.getElementById("syncVal").innerText = currentSync + "%";
        };

        document.addEventListener('keydown', function(event) {
            if (event.key === '1') changeDensity(-20, null);
            if (event.key === '2') changeDensity(20, null);
            if (event.key === '3') changeSync(-20, null);
            if (event.key === '4') changeSync(20, null);
        });

        function updateGraph() {
            const numActiveLinks = Math.max(numNodes - 1, Math.floor((currentDensity / 100) * allLinks.length));
            const activeLinks = allLinks.slice(0, numActiveLinks);

            linkGroup.selectAll("line")
                .data(activeLinks)
                .join("line")
                .attr("class", "link")
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
        }

        function pulse() {
            const maxDelay = 1500 - (currentSync * 15); 
            nodeGroup.selectAll("circle")
                .transition()
                .delay(d => Math.random() * maxDelay)
                .duration(600)
                .attr("r", 2.5) // Miniature pulse size
                .transition()
                .duration(600)
                .attr("r", 1.5) // Miniature base size
                .on("end", pulse);
        }

        updateGraph();
        pulse();
    </script>
</body>
</html>
